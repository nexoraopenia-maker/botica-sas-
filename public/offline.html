<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <title>Sin conexión · AIMA ERP</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
           background: #0b1220; color: #e8edf7; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    img { width: 180px; height: auto; margin-bottom: 24px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 auto 20px; max-width: 360px; color: #a9b4c6; line-height: 1.5; }
    button { font: inherit; font-weight: 600; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer;
             background: linear-gradient(90deg, #1f6bff, #19c3ff); }
  </style>
</head>
<body>
  <main>
    <img src="/brand/aima-logo.png" alt="AIMA" />
    <h1>Sin conexión a internet</h1>
    <p>No pudimos conectar con el servidor. Revise su conexión; sus datos están seguros y la venta no se registró si no vio la confirmación.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
